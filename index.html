<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Železniční inženýr</title>
<meta name="theme-color" content="#7cc9f5">
<meta name="description" content="Postav železnici napříč Českem a dovez městům, co potřebují.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Žel. inženýr">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%} body{-webkit-user-select:none;user-select:none;overscroll-behavior:none}</style>
<script src="config.js"></script>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: toy-box game screen — chunky status bar, 3D diorama of Czechia, candy-coloured tool tray. Single bright daytime look by choice. */
:root{
  --sky:#a8e0ff; --sky-2:#7cc9f5; --ink:#22304d; --muted:#5d6d8f; --paper:#ffffff; --paper-2:#eef7ff;
  --sun:#ffc93c; --sun-deep:#e8a60b; --cherry:#ff5a4f; --leaf:#3cc46f; --berry:#7b6cff; --line:#d5e6f5;
  --f-display:'Baloo 2','Trebuchet MS',sans-serif;
  --f-body:'Baloo 2','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:linear-gradient(180deg,var(--sky),var(--sky-2));color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.clockbrand{flex-direction:row;align-items:center;gap:10px}
.stclock{width:58px;height:58px;flex-shrink:0;filter:drop-shadow(0 3px 0 rgba(34,48,77,.2))}
.stclock #hHand,.stclock #mHand,.stclock #sDot{transform-origin:50px 50px;transition:transform .25s}
.clockinfo{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.clockinfo b{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.clockinfo small{font-size:11.5px;font-weight:700;color:var(--muted)}
.routepanel{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;background:rgba(255,255,255,.96);border-radius:16px;padding:10px 12px;box-shadow:0 6px 24px rgba(34,48,77,.25);display:grid;gap:7px}
.routepanel[hidden]{display:none}
.routepanel h4{margin:0;font-family:var(--f-display);font-size:16px}
.routepanel .rstops{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.routepanel .rstops span{background:#1e40af;color:#fff;border-radius:99px;padding:3px 10px;font-weight:800;font-size:12.5px}
.routepanel .rstops span.last{background:#38b6f5}
.routepanel .rstops i{font-style:normal;color:var(--muted);font-weight:800}
.routepanel p{margin:0;font-size:12.5px;font-weight:700;color:var(--muted)}
.routepanel .actions{margin:0;flex-wrap:wrap}
.night .stage canvas{filter:none}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1;color:var(--ink);text-wrap:balance}
h1 span{color:var(--cherry)}
.chips{display:flex;gap:6px;align-items:center;flex-shrink:0}
.chip{background:var(--paper);border-radius:14px;padding:4px 10px 2px;box-shadow:0 3px 0 rgba(34,48,77,.18);display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.chip small{font-family:var(--f-display);font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chip b{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;transition:color .3s}
.chip b.neg{color:var(--cherry)} .chip b.up{color:var(--leaf)}
.player{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:14px;padding:5px 10px 5px 5px;box-shadow:0 3px 0 rgba(34,48,77,.18);min-width:0;border:0;text-align:left}
.player img{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--paper-2)}
.player span{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.player b{font-family:var(--f-display);font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.player small{font-size:11px;color:var(--muted);white-space:nowrap}
.player small.ok{color:var(--leaf)}
.bar{display:flex;gap:8px;align-items:center}
.goalpill{flex:1;min-width:0;border:0;background:var(--paper);border-radius:14px;padding:6px 10px 7px;box-shadow:0 3px 0 rgba(34,48,77,.18);text-align:left;display:grid;gap:4px;color:var(--ink)}
.goalpill .gl{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goalpill .gl span{color:var(--muted)}
.goalpill .gbar{display:grid;gap:2px}
.goalpill .gbar i{display:block;height:4px;border-radius:2px;background:#ffb020;min-width:3px}
.goalpill .gbar i.c{background:var(--leaf)}
.rowbtn{width:100%;border:0;background:none;padding-left:0;padding-right:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.needs{display:none!important}
.seg[hidden]{display:none}
.seg{display:flex;background:rgba(255,255,255,.55);border-radius:14px;padding:3px;flex:1;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:11px;font-family:var(--f-display);font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 0 rgba(34,48,77,.15)}
.speed{border:0;background:var(--paper);border-radius:12px;padding:8px 12px;font-family:var(--f-display);font-weight:700;box-shadow:0 3px 0 rgba(34,48,77,.18)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.needs{flex-shrink:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:8px;overflow-x:auto;scrollbar-width:none}
.stepn{display:flex;align-items:center;gap:8px}
.stepn span{width:24px;height:24px;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center;font-size:13px}
.sugg{display:grid;gap:7px;margin:6px 0}
.sug{border:0;border-radius:14px;padding:10px 12px;background:var(--paper-2);text-align:left;box-shadow:0 3px 0 var(--line);display:grid;gap:4px;color:var(--ink)}
.sug b{font-family:var(--f-display);font-size:16px;font-weight:700}
.sug:active,.addw2:active,.wbtn:active{transform:translateY(2px)}
.cg{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;margin-right:9px}
.cg i{width:11px;height:11px;border-radius:50%}
.cgs{margin:-2px 0 6px}
.routeline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.rs{background:var(--ink);color:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.rs button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:20px;height:20px;font-weight:800;line-height:1}
.arr{font-weight:800;color:var(--muted)}
.actions.left{justify-content:flex-start}
details.more{margin:6px 0 8px}
details.more summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--berry);padding:4px 0}
.trainstrip{overflow-x:auto;scrollbar-width:none;border-radius:14px;margin:6px 0 2px;padding:10px 8px 0;
  background:linear-gradient(#9b7653,#9b7653) 0 calc(100% - 4px)/100% 3px no-repeat, repeating-linear-gradient(90deg,#8a5a3a 0 6px,transparent 6px 16px) 0 100%/100% 9px repeat-x, linear-gradient(#c7f0ff,#e8fbe3);
  animation:rails .6s linear infinite}
.ministrip .trainstrip{transform:scale(.62);transform-origin:left bottom;margin:-14px 0 -6px;width:161%;background:none;animation:none;padding:4px 0 0}
@keyframes rails{to{background-position:0 calc(100% - 4px),-16px 100%,0 0}}
.tsin{display:flex;align-items:flex-end;width:max-content}
.wbtn{border:0;background:none;padding:0;position:relative;display:block;line-height:0}
.wbtn .wx{position:absolute;top:2px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--cherry);color:#fff;font-weight:800;font-size:13px;line-height:18px;text-align:center}
.wbtn.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:translateX(-30px) scale(.6);opacity:0}70%{transform:translateX(3px) scale(1.05);opacity:1}100%{transform:none}}
.wsvg .wh{animation:spin .55s linear infinite;transform-box:fill-box;transform-origin:center}
.wsvg .bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(-1.3px)}}
.wsvg .smoke circle{fill:#fff;opacity:0;animation:puff 1.8s linear infinite;transform-box:fill-box;transform-origin:center}
.wsvg .smoke circle:nth-child(2){animation-delay:.6s}.wsvg .smoke circle:nth-child(3){animation-delay:1.2s}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-30px,-6px) scale(2.2)}}
.addgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin:6px 0}
.addw2{border:0;border-radius:14px;padding:8px 10px 9px;background:var(--paper-2);text-align:left;display:grid;justify-items:center;gap:2px;box-shadow:0 3px 0 var(--line);color:var(--ink);min-width:0}
.addw2.fit{background:#e7f8ec;box-shadow:0 3px 0 #b8e6c6}
.addw2 span{display:grid;justify-items:center;text-align:center}
.addw2 b{font-weight:800;font-size:13px}
.addw2 small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.25}
.addw2 em{font-style:normal;font-weight:800;font-size:12px;color:var(--leaf);margin-top:2px}
.addw2:disabled{opacity:.45}
.btn.big{font-size:17px;padding:13px 20px}
.sub.tiny{font-size:11.5px;margin-top:0}
@media (prefers-reduced-motion:reduce){.wsvg *,.trainstrip{animation:none!important}}
.city.goal{background:#fff7dc}
.city.goal .needlist{grid-template-columns:1.45fr 1fr}
.city{background:var(--paper);border-radius:16px;padding:8px 11px;min-width:0;box-shadow:0 3px 0 rgba(34,48,77,.15)}
.city header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.city h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700}
.stars{font-family:var(--f-display);font-weight:700;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sun);color:var(--ink);white-space:nowrap}
.stars.ok{background:var(--leaf);color:#fff}
.needlist{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.need{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:3px 6px;font-size:12.5px;font-weight:700;min-width:0}
.need i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.need span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need b{font-family:var(--f-display);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.need .track{grid-column:1/-1;height:6px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.need .fill{display:block;height:100%;border-radius:4px;transition:width .4s}
.city .done{margin:0;color:var(--leaf);font-weight:700;font-size:13px}
.stage{flex:1;min-height:200px;position:relative;border-radius:20px;overflow:hidden;background:var(--sky);border:3px solid var(--paper);box-shadow:0 5px 0 rgba(34,48,77,.18)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.undo{position:absolute;left:10px;bottom:10px;border:0;border-radius:14px;padding:10px 14px;background:var(--paper);font-family:var(--f-display);font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(34,48,77,.2);display:flex;align-items:center;gap:6px}
.undo svg{width:20px;height:20px}
.undo small{font-family:var(--f-body);font-weight:800;font-size:11.5px;color:var(--leaf)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.zoom .rot{display:flex;gap:5px;background:rgba(255,255,255,.55);padding:4px;border-radius:15px}
.zoom .rot button{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--ink);font-size:0}
#compassN{width:22px;height:22px;display:block;position:relative;transition:none}
#compassN i{position:absolute;left:50%;top:1px;bottom:1px;width:8px;margin-left:-4px;background:linear-gradient(var(--cherry) 0 50%,#c3cede 50% 100%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.zoom button{width:42px;height:42px;border-radius:13px;border:0;background:var(--paper);font-family:var(--f-display);font-weight:700;font-size:22px;box-shadow:0 3px 0 rgba(34,48,77,.2)}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-6px);max-width:calc(100% - 24px);background:var(--paper);border-radius:14px;padding:9px 13px;font-size:13px;font-weight:700;line-height:1.35;box-shadow:0 4px 0 rgba(34,48,77,.18);pointer-events:none;transition:opacity .25s,transform .25s;opacity:0;border-left:6px solid var(--sun)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-left-color:var(--cherry)} .toast.good{border-left-color:var(--leaf)}
.float{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;background:var(--leaf);padding:2px 8px;border-radius:99px;box-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap;will-change:transform}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tool{border:0;border-radius:15px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;background:var(--paper);box-shadow:0 4px 0 rgba(34,48,77,.2);transition:transform .08s}
.tool:active{transform:translateY(2px)}
.tool svg{width:24px;height:24px}
.tool strong{font-family:var(--f-display);font-weight:600;font-size:13.5px}
.tool small{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.tool[aria-pressed="true"]{background:var(--berry);color:#fff;box-shadow:0 4px 0 #4f43c9}
.tool[aria-pressed="true"] small{color:#e0dcff}
.tool.depot{background:var(--sun);box-shadow:0 4px 0 var(--sun-deep)}
.tool.depot small{color:#6b4d00}
.hint{margin:0;color:var(--ink);opacity:.8;font-size:12.5px;font-weight:700;line-height:1.35;min-height:2.7em}
/* levels */
.levels{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;align-content:start;padding-bottom:12px}
.panel{grid-column:1/-1;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 rgba(34,48,77,.15)}
.panel h2{margin:0 0 6px;font-family:var(--f-display);font-size:20px;font-weight:700}
.panel p{margin:0;color:var(--muted);font-size:13px;line-height:1.4;max-width:65ch}
.board{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:24px 30px 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:var(--paper-2);min-width:0}
.board li.me{background:#fff3c7}
.board .rank{font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:center}
.board img{width:30px;height:30px;border-radius:50%}
.board .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.board .nm small{display:block;font-weight:700;font-size:11px;color:var(--muted)}
.board .sc{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.lv{background:var(--paper);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;min-width:0;box-shadow:0 3px 0 rgba(34,48,77,.12)}
.lv .num{grid-row:1/4;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;background:var(--paper-2);color:var(--muted);font-variant-numeric:tabular-nums}
.lv.play .num{background:var(--sun);color:var(--ink)}
.lv.won .num{background:var(--leaf);color:#fff}
.lv h4{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.lv h4 em{font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:800;color:var(--muted);align-self:center;white-space:nowrap}
.lv.play h4 em{color:var(--sun-deep)} .lv.won h4 em{color:var(--leaf)}
.lv p{margin:0;font-size:12.5px;line-height:1.35;color:var(--muted);min-width:0}
.lv p b{color:var(--ink);font-weight:800}
/* sheets */
.tcwrap{position:fixed;inset:0;z-index:12;display:grid;place-items:center;padding:12px;overflow-y:auto;background:rgba(34,48,77,.28);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:fadein .18s}
.tcwrap[hidden]{display:none}
.tcard{box-sizing:border-box;max-width:100%;max-height:calc(100vh - 24px);overflow-y:auto;overflow-x:hidden;width:min(420px,100%);background:var(--paper);border-radius:22px;padding:16px 16px 12px;box-shadow:0 18px 50px rgba(34,48,77,.35);animation:cardin .22s ease-out}
.tcard *{min-width:0;box-sizing:border-box}
.tcard .trainstrip{max-width:100%}
.tcard .actions{flex-wrap:wrap}
.tcard header small{display:block;overflow-wrap:anywhere}
.countdown{display:grid;grid-template-columns:1fr auto;align-items:baseline;background:var(--ink);color:#fff;border-radius:14px;padding:8px 12px;margin:6px 0}
.countdown small{grid-column:1/-1;font-size:11.5px;font-weight:700;opacity:.75}
.countdown b{font-family:var(--f-display);font-size:30px;line-height:1.05}
.countdown span{font-size:12px;font-weight:700;opacity:.8}
.tt.mini{width:100%;font-size:12.5px;margin:4px 0}
.tt.mini td{padding:3px 4px}
.tt.mini td small{display:block;font-size:10px;color:var(--muted)}
.tt.mini tr.here td{background:#fff7dc}
.warnicon{font-size:30px;line-height:1}
.tcard header{display:flex;align-items:center;gap:10px}
.tcard header>div{flex:1;min-width:0}
.tcard h2{margin:0;font-family:var(--f-display);font-size:21px}
.tcard header small{color:var(--muted);font-weight:700;font-size:12.5px}
.tcard .dot{width:16px;height:16px;margin:0}
.steps{margin:6px 0 8px;padding-left:20px;display:grid;gap:5px;font-size:13.5px;font-weight:700}
.recipe{background:#fff7dc;border-radius:14px;padding:8px 11px;margin:6px 0;display:grid;gap:2px}
.recipe b{font-size:13.5px}
.recipe small{font-size:12px;color:var(--muted);font-weight:700}
.cc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.cc>div{background:var(--paper-2);border-radius:14px;padding:8px 10px;min-width:0}
.cc h4{margin:0 0 6px;font-family:var(--f-display);font-size:15px}
.cc .need{margin-bottom:5px}
.cc .need .track{background:#fff}
.cc .wagons{margin:2px 0}
.cc small.sub{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
@media (max-width:360px){ .cc{grid-template-columns:1fr} }
.verdict{font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.verdict.ok{background:var(--leaf)} .verdict.bad{background:var(--cherry)}
.tcnums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.tcnums div{background:var(--paper-2);border-radius:12px;padding:7px 9px;display:grid}
.tcnums small{font-size:11px;font-weight:700;color:var(--muted)}
.tcnums b{font-family:var(--f-display);font-size:16px}
.tcard .okc{color:#1f9d55} .tcard .warn{color:var(--cherry)}
@keyframes fadein{from{opacity:0}}

class Heap{ constructor(){ this.a=[]; } get size(){ return this.a.length; }
  push(n,p){ const a=this.a; a.push([p,n]); let i=a.length-1; while(i>0){ const j=(i-1)>>1; if(a[j][0]<=a[i][0]) break; const t=a[i]; a[i]=a[j]; a[j]=t; i=j; } }
  pop(){ const a=this.a, top=a[0], last=a.pop(); if(a.length){ a[0]=last; let i=0; for(;;){ const l=2*i+1, r=l+1; let m=i; if(l<a.length&&a[l][0]<a[m][0]) m=l; if(r<a.length&&a[r][0]<a[m][0]) m=r; if(m===i) break; const t=a[i]; a[i]=a[m]; a[m]=t; i=m; } } return top[1]; } }
// Trains may not turn sharper than ~95 degrees at a node, and never reverse mid-route.
const TURN_MIN=-0.09;
function turnOK(p,u,v){ const A=nodes[p],B=nodes[u],C=nodes[v]; const [ax,ay]=unit(A.x,A.y,B.x,B.y), [bx,by]=unit(B.x,B.y,C.x,C.y); return ax*bx+ay*by>=TURN_MIN; }
function routePath(from,to,avoid,startPrev){
  if(from===to) return [from]; const sp=startPrev==null?-1:startPrev;
  const dd=new Map(), prev=new Map(), done=new Set(), open=new Heap(); const k0=sp+'>'+from; dd.set(k0,0); open.push([sp,from],0); let endKey=null;
  while(open.size){ const [p,u]=open.pop(), ku=p+'>'+u; if(done.has(ku)) continue; done.add(ku); if(u===to){ endKey=ku; break; }
    const rev=nodeSite.has(u);   // trains may reverse inside a station
    let thrOrigin=null; if(p>=0 && throatKeys.has(ekey(p,u))){ let k=ku; while(k){ const [a,b]=k.split('>').map(Number); if(a<0 || !throatKeys.has(ekey(a,b))){ thrOrigin=a; break; } k=prev.get(k); } }
    const inThr = p>=0 && throatKeys.has(ekey(p,u));
    for(const v of adj.get(u)||[]){ const thrUV=throatKeys.has(ekey(u,v));
      if(thrUV && !inThr && p>=0 && !nodeSite.has(p) && !fanPorts.has(u)) continue;          // a line joined to one track has no switches to the others
      if(!thrUV && inThr && !nodeSite.has(v) && !fanPorts.has(u)) continue;
      const sw = portOf.has(u) && p>=0 && (nodeSite.has(p) || throatKeys.has(ekey(p,u)) || throatKeys.has(ekey(u,v))) && v!==p;   // station switches: no turn limit inside the throat
      if(rev && p>=0 && v!==p){ const a=portOf.get(p), c=portOf.get(v); if(a && c && a.k!==c.k) continue; }
      if(!rev && !sw && (v===p || (p>=0 && !turnOK(p,u,v)))) continue; const kv=u+'>'+v; if(done.has(kv)) continue;
      if(thrOrigin!==null && !throatKeys.has(ekey(u,v))){ const fromPlat=nodeSite.has(thrOrigin); if(fromPlat ? nodeSite.has(v) : !nodeSite.has(v)) continue; }
      const k=ekey(u,v); let w=edges.get(k).len; if(avoid && avoid.has(k)) w+=5000;
      const nd=dd.get(ku)+w; if(nd<(dd.has(kv)?dd.get(kv):Infinity)){ dd.set(kv,nd); prev.set(kv,ku); open.push([u,v],nd); } } }

}

const LV_WIN=600, LV_NEED=5, LV_KEEP=2;   // 600 game minutes = 10 real minutes at 1×

function evalLevel(c){ if(!c.levels) return; const t0=gameMin-LV_WIN; while(c.log.length && c.log[0][0]<t0) c.log.shift();

const MAX_WORK=9;   // a stop never takes more than ~20 game minutes (20 s at 1×)
const STOP_UNLOAD=5, STOP_LOAD=10;   // every stop takes exactly 15 game minutes = 15 s at 1×
const dwellEst = tr => STOP_UNLOAD+STOP_LOAD;
const planCache=new Map();
function planOf(tr){
  const dw=dwellEst(tr), key=netVer+'|'+tr.route.join(',')+'|'+dw+'|'+(tr.waits||[]).join(',');
  if(planCache.has(key)) return planCache.get(key);
  const R=tr.route, n=R.length, res={ok:false,legs:[],dep:[0],arr:[null],cycle:0,dwell:dw,bad:null};
  if(n<2) res.bad=L('Trasa potřebuje aspoň dvě zastávky.','A route needs at least two stops.','Eine Strecke braucht mindestens zwei Halte.');
  else { let ok=true;
    for(let i=0;i<n;i++){ const a=site(R[i]).node, b=site(R[(i+1)%n]).node; const path=routePath(a,b);
      if(!path){ ok=false; { const A=site(R[i]).name, B=site(R[(i+1)%n]).name; res.bad=L(`Mezi zastávkami ${A} a ${B} chybí trať.`,`There is no track between ${A} and ${B}.`,`Zwischen ${A} und ${B} fehlt ein Gleis.`); } break; }
      const len=pathLen(path), travel=len/SPEED, d=res.dep[i], ar=d+travel;
      res.legs.push({path,dep:d,arr:ar,from:i,to:(i+1)%n,km:len*KM_PER_UNIT,travel});
      if(i<n-1){ res.arr[i+1]=ar; res.dep[i+1]=ar+dw+((tr.waits||[])[i+1]||0); } else res.arr[0]=ar; }
    res.ok=ok; if(ok) res.cycle=res.arr[0]+dw; }
  if(planCache.size>500) planCache.clear(); planCache.set(key,res); return res;
}
function nextSlot(tr,after){ const E=tr.every*60; return tr.start + Math.ceil((after-tr.start-1e-6)/E)*E; }

function pos(tr){
  const p=tr.path; if(!p || tr.pi>=p.length-1){ const n=p?NP(p,tr.pi):nodes[tr.at]; return {x:n.x,y:n.y}; }
  const A=NP(p,tr.pi), B=NP(p,tr.pi+1), L=Math.hypot(B.x-A.x,B.y-A.y), t=Math.min(tr.t,L);
  if(tr.pi+2<p.length && cornerAtEnd(p[tr.pi+1],p[tr.pi])){ const R=cornerR(p[tr.pi+1]); if(t>L-R){ const X=nodes[p[tr.pi+2]], [ix,iy]=unit(A.x,A.y,B.x,B.y), [ox,oy]=unit(B.x,B.y,X.x,X.y);
    return bez({x:B.x-ix*R,y:B.y-iy*R},B,{x:B.x+ox*R,y:B.y+oy*R},(t-(L-R))/(2*R)); } }
  if(tr.pi>0 && cornerAtEnd(p[tr.pi],p[tr.pi+1])){ const R=cornerR(p[tr.pi]); if(t<R){ const Pv=nodes[p[tr.pi-1]], [ix,iy]=unit(Pv.x,Pv.y,A.x,A.y), [ox,oy]=unit(A.x,A.y,B.x,B.y);

}

}

sheet.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.ed){ edAction(b); return; }
  if(b.dataset.open){ openEditor(b.dataset.open==='new'?0:+b.dataset.open, b.dataset.from); return; }
  if(b.dataset.lang){ setLang(b.dataset.lang); return; }
  if(b.dataset.close!==undefined){ closeSheet(); return; }
  if(b.dataset.levels!==undefined){ closeSheet(); showTab('levels'); return; }
  if(b.dataset.plans!==undefined){ closeSheet(); showTab('plans'); return; }
  if(b.dataset.site){ showSite(site(b.dataset.site)); return; }
  if(b.dataset.reset!==undefined){ resetGame(); closeSheet(); return; }
  if(b.dataset.zoom!==undefined){ zoomInvert=b.dataset.zoom==='1'; try{ localStorage.setItem('zi-zoom2',zoomInvert?'1':'0'); }catch(e){} $('playerBtn').click(); return; }
  if(b.dataset.glogin!==undefined){ googleLogin(); return; }
  if(b.dataset.glogout!==undefined){ googleLogout(); closeSheet(); return; }
});

function plansHtml(){
  const cs=conflicts(trains,gameMin,gameMin+1440);
  let h=`<div class="actions left"><button class="btn small ghost" data-back>← ${L('Zpět na mapu','Back to the map','Zurück zur Karte')}</button></div><section class="panel"><h2>${L('Střety v příštích 24 h','Conflicts in the next 24 h','Konflikte in den nächsten 24 h')}</h2>`+(trains.length ? (cs.length ? cs.slice(0,14).map(conflictHtml).join('') : `<div class="alert ok">${L('Podle jízdních řádů se žádné vlaky nesrazí.','According to the timetables no trains will collide.','Laut Fahrplänen stößt kein Zug zusammen.')}</div>`) : `<p>${L('Zatím nejezdí žádné vlaky.','No trains are running yet.','Noch fahren keine Züge.')}</p>`)+
    `<p class="sub">${L('Srážka hrozí, když dva vlaky pojedou proti sobě po stejné koleji. Pomůže posunout odjezd, postavit vedle druhou kolej (výhybnu), nebo dát návěstidla na oba konce úseku.','A crash happens when two trains run head-on along the same track. Move a departure, build a second track alongside (a passing loop), or put signals at both ends of the section.','Ein Unfall droht, wenn zwei Züge auf demselben Gleis aufeinander zufahren. Verschiebe eine Abfahrt, baue ein zweites Gleis daneben (Ausweiche) oder stelle an beiden Enden Signale auf.')}</p></section>`;
  if(trains.length){ h+=`<section class="panel"><h2>${L('Vlaky','Trains','Züge')}</h2>`+trains.map(tr=>`<div class="row"><i style="background:${tr.color}"></i><div><b>${esc(tr.name)} · ${tr.route.map(id=>site(id).name).join(' → ')}</b><small class="${statusCls(tr)}">${statusText(tr)}</small><small>${L('odjezd','departs','Abfahrt')} ${hm(tr.start)}, ${everyLabel(tr.every)}</small></div><button class="btn small ghost" data-open="${tr.id}">${L('Upravit','Edit','Bearbeiten')}</button></div>`).join('')+`</section>`;
    const {visits}=predict(trains,gameMin,gameMin+1440);
    for(const [node,vs] of visits){ const s=nodeSite.get(node); const rows=vs.filter(v=>v.d>=gameMin).sort((a,b)=>a.d-b.d).slice(0,8);
      h+=`<section class="panel"><h2>${s.name}<em>${s.plat} ${kolej(s.plat)}</em></h2><ul class="dep">`+(rows.length?rows.map(v=>`<li><span class="tm">${hm(v.d)}</span><span><i class="dot" style="background:${v.tr.color}"></i>${esc(v.tr.name)} → ${site(v.tr.route[(v.i+1)%v.tr.route.length]).name}</span><small>${L('příj.','arr.','an')} ${hm(v.a)}</small></li>`).join(''):`<li><span>${L('Dnes už nic','Nothing more today','Heute nichts mehr')}</span></li>`)+`</ul></section>`; } }
  return h;
}

function loadState(st){
  if(!st || st.v!==7 || st.base!==BASE_NODES) return false;
  const was=ready; ready=false; clearWorld();
  money=st.money; score=st.score||0; built=st.built||0; deliveries=st.deliveries||0; crashes=st.crashes||0; won=!!st.won; gameMin=st.gameMin||360; goalHit=!!st.goalHit; incomeLog=st.incomeLog||[]; curRate=-1;
  for(const [x,y] of st.nodes||[]) addNode(x,y);
  for(const [a,b,c] of st.edges||[]) if(nodes[a]&&nodes[b]) addEdge(a,b,c);
    for(const s of st.signals||[]) if(nodes[s]) signals.add(s); for(const s of st.entry||[]) if(nodes[s]) entrySig.add(s);
  for(const x of st.sites||[]){ const s=site(x.id); if(!s) continue; Object.assign(s.stock,x.stock||{}); Object.assign(s.inbuf,x.inbuf||{}); s.tm=x.tm||{}; if(s.levels){ s.lvl=x.lvl||0; s.log=x.log||[]; s.since=x.since||0; s.best=x.best||0; s.got={}; s.done=!!x.done; } }
  for(const t of st.trains||[]) if(t.route.every(id=>site(id))) makeTrain(t);
  nextId=Math.max(nextId,st.nextId||1);
  consumers.forEach(refreshLabel); setMoney(money); addScore(0); rebuildTracks(); renderNeeds(); ready=was; return true;
}

      await fb.db.collection('scores').doc(uid).set({score, praha, won, name:myName||'Hráč', photo:fb.photo||'', updatedAt:st.savedAt}); setSave(['Uloženo k Google účtu','Saved to Google account','Im Google-Konto gespeichert'],true); }

  const comp=ctx.createDynamicsCompressor(); SND.master.connect(comp); comp.connect(ctx.destination);

  { const s=loopSrc(SND.pink), f=ctx.createBiquadFilter(), g=ctx.createGain(); f.type='lowpass'; f.frequency.value=700; g.gain.value=0; s.connect(f); f.connect(g); g.connect(SND.master); SND.wind=g; }
  // one looping voice per place: city traffic, factory machines, airport
  for(const s of SITES){ const n=nodes[s.node], v={x:n.x,y:n.y,site:s,parts:[]};
    const out=ctx.createGain(); out.gain.value=0; const pan=ctx.createStereoPanner?ctx.createStereoPanner():null; if(pan){ out.connect(pan); pan.connect(SND.master); } else out.connect(SND.master); v.out=out; v.pan=pan;
    if(s.kind==='city'){ const src=loopSrc(SND.brown), f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=480; src.connect(f); f.connect(out);
      const hiss=loopSrc(SND.pink), f2=ctx.createBiquadFilter(), g2=ctx.createGain(); f2.type='bandpass'; f2.frequency.value=1300; f2.Q.value=0.6; g2.gain.value=0.25; hiss.connect(f2); f2.connect(g2); g2.connect(out);
      v.base = s.id==='praha'?0.55 : s.tourist?0.28 : 0.42; v.kind='city'; }
    else if(s.kind==='airport'){ const src=loopSrc(SND.pink), f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=0.4; src.connect(f); f.connect(out); v.base=0.22; v.kind='airport'; }
    else if(s.makes || s.kind==='factory'){ const o=ctx.createOscillator(), og=ctx.createGain(); o.type='sawtooth'; o.frequency.value=s.id==='trinec'?42:58; og.gain.value=0.08; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=260; o.connect(f); f.connect(og); og.connect(out); o.start();
      const src=loopSrc(SND.brown), f2=ctx.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=300; src.connect(f2); f2.connect(out); v.base=s.id==='mb'?0.4:0.3; v.kind='factory'; }
    else { const src=loopSrc(SND.pink), f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; src.connect(f); f.connect(out); v.base=0.08; v.kind='field'; }
    SND.voices.push(v); }

  for(let i=0;i<4;i++){ const out=ctx.createGain(); out.gain.value=0; const pan=ctx.createStereoPanner?ctx.createStereoPanner():null; if(pan){ out.connect(pan); pan.connect(SND.master); } else out.connect(SND.master);
    const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=70; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420; const og=ctx.createGain(); og.gain.value=0.35; o.connect(f); f.connect(og); og.connect(out); o.start();
    const o2=ctx.createOscillator(); o2.type='square'; o2.frequency.value=140; const f2=ctx.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=300; const g2=ctx.createGain(); g2.gain.value=0.06; o2.connect(f2); f2.connect(g2); g2.connect(out); o2.start();
    const rumble=loopSrc(SND.brown), rf=ctx.createBiquadFilter(), rg=ctx.createGain(); rf.type='lowpass'; rf.frequency.value=220; rg.gain.value=0.8; rumble.connect(rf); rf.connect(rg); rg.connect(out);

['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,sndInit,{passive:true}));
sndBtnPaint();
// how loud something at (x,y) is for the listener, and where it sits left/right
function hearing(x,y){ const lx=target.x+CX, ly=target.z+CZ, d=Math.hypot(x-lx,y-ly), R=50+camD*0.45, zf=Math.max(0.05,Math.min(1,1.15-Math.log(camD/110)/Math.log(22)));
  const att=1/(1+(d/R)*(d/R)); let pan=0; if(SND.ctx){ _pv.set(x-CX,0,y-CZ).project(camera); pan=Math.max(-1,Math.min(1,_pv.x)); }
  return {g:att*zf, pan, att, zf}; }
function setG(param,v){ if(SND.ctx) param.setTargetAtTime(v,SND.ctx.currentTime,0.15); }
function sndUpdate(){ if(!SND.ready) return; const ctx=SND.ctx;
  const zf=Math.max(0.05,Math.min(1,1.15-Math.log(camD/110)/Math.log(22))); setG(SND.wind.gain, 0.03+0.03*(1-zf));
  // all places together must never get louder than one place heard up close
  const gs=SND.voices.map(v=>{ const h=hearing(v.x,v.y); let g=v.base*h.g; if(v.kind==='city' && daylight()<0.3) g*=0.45; if(v.kind==='airport' && planeT>=0) g*=3.2; v.h=h.g; return [g,h]; });
  const sum=gs.reduce((a,x)=>a+x[0],0); SND.norm=Math.min(1,(0.06+0.2*zf)/(sum||1));
  SND.voices.forEach((v,i)=>{ setG(v.out.gain, gs[i][0]*SND.norm); if(v.pan) setG(v.pan.pan, gs[i][1].pan*0.8); });
  // trains: pick the most audible ones
  const ranked=trains.filter(t=>t.parts && t.st!=='dead').map(t=>{ const m=t.parts[0].position; const h=hearing(m.x+CX,m.z+CZ); return {t,h}; }).sort((a,b)=>b.h.g-a.h.g).slice(0,SND.trainV.length);
  SND.trainV.forEach((tv,i)=>{ const r=ranked[i]; if(!r || r.h.g<0.004){ setG(tv.out.gain,0); tv.tr=null; return; }
    const t=r.t, moving=t.st==='run', sp=SPEEDS[speedIdx]?1:0; tv.tr=t;
    setG(tv.out.gain, r.h.g*(moving?0.32:0.12)*(sp?1:0.3)*(0.35+0.65*zf)); if(tv.pan) setG(tv.pan.pan, r.h.pan*0.8);
    setG(tv.o.frequency, moving?78+Math.min(3,SPEEDS[speedIdx])*6:52); setG(tv.o2.frequency, moving?156:104); setG(tv.rg.gain, moving?0.9:0.15);
    // wheels over rail joints: ta-dam ... ta-dam
    if(moving && sp){ tv.clk-=0.1*Math.min(4,SPEEDS[speedIdx]); if(tv.clk<=0){ tv.clk=0.9; clack(tv.out,0); clack(tv.out,0.13); } } }); }
setInterval(sndUpdate,100);
// leaving the game (other app, other tab, screen off) silences it at once
function sndPause(off){ if(!SND.ctx) return; try{ if(off) SND.ctx.suspend(); else if(SND.on) SND.ctx.resume(); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ sndPause(document.hidden); if(document.hidden && ready && !window.__TEST){ clearTimeout(saveTimer); save(); } });
window.addEventListener('pagehide',()=>sndPause(true)); window.addEventListener('pageshow',()=>sndPause(document.hidden));
window.addEventListener('blur',()=>sndPause(true)); window.addEventListener('focus',()=>sndPause(false));
// --- one-shot sounds ---
function envGain(at,peak,a,d){ const g=SND.ctx.createGain(), t=SND.ctx.currentTime+at; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); return g; }
function clack(out,at){ if(!SND.ready) return; const ctx=SND.ctx, s=ctx.createBufferSource(); s.buffer=SND.white; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1700; f.Q.value=2; const g=envGain(at,0.9,0.003,0.07); s.connect(f); f.connect(g); g.connect(out); s.start(ctx.currentTime+at,Math.random()*2,0.12); }
function placed(x,y,mult){ if(!SND.ready || !SND.on || document.hidden) return null; const h=hearing(x,y), g=h.g*(mult||1)*(SND.norm==null?1:Math.max(0.35,SND.norm)); if(g<0.01) return null; const ctx=SND.ctx, out=ctx.createGain(); out.gain.value=g;
  if(ctx.createStereoPanner){ const p=ctx.createStereoPanner(); p.pan.value=h.pan*0.8; out.connect(p); p.connect(SND.master); } else out.connect(SND.master); setTimeout(()=>{ try{ out.disconnect(); }catch(e){} },6000); return out; }
function sndHorn(x,y,two){ const out=placed(x,y,0.5); if(!out) return; const ctx=SND.ctx;
  [[0,0.55,370],[two?0.6:-1,0.5,311]].forEach(([at,len,f])=>{ if(at<0) return; for(const m of [1,1.5]){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=f*m; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800; const g=envGain(at,0.18/m,0.03,len); o.connect(lp); lp.connect(g); g.connect(out); o.start(ctx.currentTime+at); o.stop(ctx.currentTime+at+len+0.1); } }); }
function sndCarHorn(x,y){ const out=placed(x,y,0.35); if(!out) return; const ctx=SND.ctx, f=380+Math.random()*120, len=0.12+Math.random()*0.35, n=Math.random()<0.4?2:1;
  for(let k=0;k<n;k++) for(const m of [1,1.26]){ const o=ctx.createOscillator(); o.type='square'; o.frequency.value=f*m; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200; const g=envGain(k*(len+0.08),0.08,0.01,len); o.connect(lp); lp.connect(g); g.connect(out); o.start(ctx.currentTime+k*(len+0.08)); o.stop(ctx.currentTime+k*(len+0.08)+len+0.05); } }
function sndSqueal(x,y){ const out=placed(x,y,0.45); if(!out) return; const ctx=SND.ctx, o=ctx.createOscillator(), o2=ctx.createOscillator(), lfo=ctx.createOscillator(), lg=ctx.createGain();
  o.type='sine'; o.frequency.value=3150; o2.type='sine'; o2.frequency.value=4410; lfo.frequency.value=7; lg.gain.value=60; lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
  const g=envGain(0,0.09,0.25,2.2), g2=envGain(0.3,0.05,0.3,1.6); o.connect(g); o2.connect(g2); g.connect(out); g2.connect(out); [o,o2,lfo].forEach(z=>{ z.start(); z.stop(ctx.currentTime+3); }); }
function sndWrench(x,y){ const out=placed(x,y,0.6); if(!out) return; const ctx=SND.ctx, s=ctx.createBufferSource(); s.buffer=SND.white; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2400; f.Q.value=3;
  const am=ctx.createGain(); am.gain.value=0; const lfo=ctx.createOscillator(); lfo.type='square'; lfo.frequency.value=22+Math.random()*8; const lg=ctx.createGain(); lg.gain.value=0.5; lfo.connect(lg); lg.connect(am.gain);
  const len=0.35+Math.random()*0.7, g=envGain(0,0.5,0.02,len); s.connect(f); f.connect(am); am.connect(g); g.connect(out); s.start(ctx.currentTime,Math.random()*2,len+0.2); lfo.start(); lfo.stop(ctx.currentTime+len+0.2); }
function sndClank(x,y){ const out=placed(x,y,0.4); if(!out) return; const ctx=SND.ctx; for(const f of [523,1189,2027,3110]){ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*(0.9+Math.random()*0.2); const g=envGain(0,0.08,0.002,0.9*523/f+0.2); o.connect(g); g.connect(out); o.start(); o.stop(ctx.currentTime+1.4); } }
function sndBird(x,y){ const out=placed(x,y,0.3); if(!out) return; const ctx=SND.ctx, n=2+Math.floor(Math.random()*4), base=2600+Math.random()*1800;
  for(let k=0;k<n;k++){ const o=ctx.createOscillator(), at=k*0.13, t=ctx.currentTime+at; o.type='sine'; o.frequency.setValueAtTime(base,t); o.frequency.exponentialRampToValueAtTime(base*(1.3+Math.random()*0.4),t+0.07); const g=envGain(at,0.05,0.01,0.08); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.12); } }
function sndJet(x,y){ const out=placed(x,y,1.2); if(!out) return; const ctx=SND.ctx, s=ctx.createBufferSource(); s.buffer=SND.pink; const f=ctx.createBiquadFilter(); f.type='lowpass'; const t=ctx.currentTime;
  f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2600,t+3); f.frequency.exponentialRampToValueAtTime(500,t+7); const g=envGain(0,0.9,1.5,5.5); s.connect(f); f.connect(g); g.connect(out); s.start(t,0,7.5); }
function sndBoom(x,y){ const out=placed(x,y,2.5) || (SND.ready&&SND.on?placedUI(0.5):null); if(!out) return; const ctx=SND.ctx, s=ctx.createBufferSource(); s.buffer=SND.brown; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; const g=envGain(0,1,0.01,2.4); s.connect(f); f.connect(g); g.connect(out); s.start(ctx.currentTime,Math.random(),2.6); }
function placedUI(v){ if(!SND.ready || !SND.on || document.hidden) return null; const g=SND.ctx.createGain(); g.gain.value=v; g.connect(SND.master); setTimeout(()=>{ try{ g.disconnect(); }catch(e){} },4000); return g; }
function sndCoin(x,y){ const out=placed(x,y,0.5) || placedUI(0.05); if(!out) return; const ctx=SND.ctx; [[0,1319],[0.07,1760]].forEach(([at,f])=>{ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f; const g=envGain(at,0.25,0.005,0.35); o.connect(g); g.connect(out); o.start(ctx.currentTime+at); o.stop(ctx.currentTime+at+0.5); }); }
function sndBuild(){ const out=placedUI(0.35); if(!out) return; const ctx=SND.ctx; for(let k=0;k<3;k++){ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=180-k*20; const g=envGain(k*0.09,0.5,0.005,0.12); o.connect(g); g.connect(out); o.start(ctx.currentTime+k*0.09); o.stop(ctx.currentTime+k*0.09+0.2); } }
function sndFanfare(){ const out=placedUI(0.3); if(!out) return; const ctx=SND.ctx; [523,659,784,1047].forEach((f,k)=>{ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f; const g=envGain(k*0.11,0.3,0.01,0.35); o.connect(g); g.connect(out); o.start(ctx.currentTime+k*0.11); o.stop(ctx.currentTime+k*0.11+0.5); }); }
// random life: car horns in cities, impact wrenches at Škoda, clanks at the ironworks, birds in the country
setInterval(()=>{ if(!SND.ready || !SND.on) return;
  for(const v of SND.voices){ if(!v.h || v.h<0.02) continue; const s=v.site, n=nodes[s.node], jx=n.x+(Math.random()-0.5)*90, jy=n.y+(Math.random()-0.5)*90;
    if(v.kind==='city' && Math.random()<(s.id==='praha'?0.45:0.25)*(daylight()<0.3?0.3:1)) sndCarHorn(jx,jy);
    else if(s.id==='mb' && Math.random()<0.6) sndWrench(jx,jy);
    else if((s.id==='trinec'||s.id==='karvina'||s.id==='ostrava') && Math.random()<0.25) sndClank(jx,jy);
    else if((v.kind==='field' || s.id==='zatec' || s.id==='mikulov' || s.id==='valtice') && daylight()>0.4 && Math.random()<0.3) sndBird(jx,jy); }
  if(daylight()>0.4 && Math.random()<0.25){ const lx=target.x+CX+(Math.random()-0.5)*200, ly=target.z+CZ+(Math.random()-0.5)*200; if(!SITES.some(s=>{ const n=nodes[s.node]; return Math.hypot(n.x-lx,n.y-ly)<150 && s.kind==='city'; })) sndBird(lx,ly); }
},700);

let lastMenuDraw=0;
function frame(now){
  const real=Math.min(0.05,(now-last)/1000); last=now;
  const dt=menuEl.hidden ? real*SPEEDS[speedIdx] : 0; const n=Math.ceil(dt/0.25); for(let i=0;i<n;i++) step(dt/n);
  renderClock(); applyDaylight(); if(tool==='route' && rStops.length>1 && Math.abs(camD/routeZoom-1)>0.25) renderRoute();
  for(const tr of trains) placeTrain(tr,now,real);
  planeTick(real);
  for(const [id,o] of signalMeshes){ const red=trains.some(t=>t.st==='hold'&&t.path&&t.path[t.pi]===id) || (entrySig.has(id) && [...(adj.get(id)||[])].some(x=>{ const po=portOf.get(x); return po && trainsAt(po.s.node).some(t=>t.plat===po.k); })) || [...(adj.get(id)||[])].some(x=>occ.has(ekey(id,x))); o.l1.material=red?LIGHT_OFF:LIGHT_G; o.l2.material=red?LIGHT_R:LIGHT_OFF; }
  if(tool==='track' && anchor!=null){ const nd=anchorPos(); ring.visible=true; ring.position.set(nd.x-CX,3,nd.y-CZ); const s=1+Math.sin(now/180)*0.12; ring.scale.set(s,s,s); } else ring.visible=false;
  const k=Math.max(0.35,camD/620); for(const sp of labelOf.values()) sp.scale.set(78*k,22.8*k,1);
  updateSmoke(real); waterTex.offset.x+=real*0.004; waterTex.offset.y+=real*0.002;
  for(let i=effects.length-1;i>=0;i--){ const f=effects[i]; f.t+=real; const s=3+f.t*24; f.ball.scale.set(s,s,s); f.ball.material.opacity=Math.max(0,1-f.t/0.6); if(f.t>0.7){ scene.remove(f.g); effects.splice(i,1); } }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.t+=real; v3.set(f.x-CX,20,f.y-CZ).project(camera);
    const tt=Math.max(0,f.t); const x=(v3.x+1)/2*W, y=(1-v3.y)/2*H-tt*40; f.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`; f.el.style.opacity=f.t<0?'0':String(Math.max(0,1-tt/1.4));
    if(f.t>1.4){ f.el.remove(); floats.splice(i,1); } }
  if(W&&H && (menuEl.hidden || now-lastMenuDraw>400)){ renderer.render(scene,camera); if(!menuEl.hidden) lastMenuDraw=now; }
  requestAnimationFrame(frame);
}
applyStatic(); setTool('pan'); rebuildTracks(); renderNeeds(); resize(); $('speed').textContent=SPEED_LABEL[speedIdx]; setMoney(money);
$('loading').remove();
requestAnimationFrame(frame);
initAccount();
})();
